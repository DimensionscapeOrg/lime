name: Debug mobile HTTP
on: [push, workflow_dispatch]

env:
  HAXE_VERSION: 4.2.5
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
  HXCPP_NONINTERACTIVE: 1
  UTEST_PATTERN: "HTTPRequest|CURL"

jobs:

  android:
    runs-on: ubuntu-22.04
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c

      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        uses: ./.github/actions/install-haxelib-libraries
        with:
          libraries: |
            native-desktop 1.2.1
            native-ipc 1.0.0
            StageWebView 1.1.0
            wsproto 1.0.0
            format 3.8.0
            hxp 1.3.1
            utest 1.13.2

      - name: Install Haxe dependencies from git
        shell: bash
        run: |
          haxelib git libhxcpp https://github.com/openfl/libhxcpp --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      - name: Prepare Lime
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime setup -alias -y -nocffi -eval

      - name: Configure Android support
        run: |
          lime config ANDROID_SDK $ANDROID_HOME -eval
          lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }} -eval
          lime config JAVA_HOME $JAVA_HOME -eval
          lime config ANDROID_SETUP true -eval

      - name: Rebuild Lime (Android)
        timeout-minutes: 90
        run: |
          lime rebuild android -release -nocolor -nocffi -eval

      - name: Build the HTTP tests (Android emulator)
        working-directory: tests/unit
        run: |
          lime build android -debug -emulator -DUTEST_PATTERN="${UTEST_PATTERN}" -nocolor -eval
          find Export -name "*.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the HTTP tests (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/debug-mobile/run-android.sh

  ios:
    runs-on: macos-15
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        uses: ./.github/actions/install-haxelib-libraries
        with:
          libraries: |
            native-desktop 1.2.1
            native-ipc 1.0.0
            StageWebView 1.1.0
            wsproto 1.0.0
            format 3.8.0
            hxp 1.3.1
            utest 1.13.2

      - name: Install Haxe dependencies from git
        shell: bash
        run: |
          haxelib git libhxcpp https://github.com/openfl/libhxcpp --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      - name: Prepare Lime
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime setup -alias -y -nocffi -eval

      - name: Rebuild Lime (iOS simulator)
        timeout-minutes: 90
        run: |
          lime rebuild ios -simulator -release -nocolor -eval

      - name: Build the HTTP tests (iOS simulator)
        working-directory: tests/unit
        run: |
          lime build ios -simulator -release -DUTEST_PATTERN="${UTEST_PATTERN}" -nocolor -eval
          find Export -name "*.app" -maxdepth 8

      - name: Run the HTTP tests (iOS simulator)
        timeout-minutes: 20
        run: |
          bash .github/debug-mobile/run-ios.sh
