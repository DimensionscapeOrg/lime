name: Probe arm64 Android emulator

on:
  push:
    branches: [probe/android-arm64-tagging]
  workflow_dispatch:

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Host
        run: |
          uname -a
          nproc
          ls -l /dev/kvm || echo "NO /dev/kvm"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          java -version 2>&1 || echo "no java"
      - name: Install command-line tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q openjdk-17-jdk-headless unzip >/dev/null
          mkdir -p "$HOME/sdk/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$HOME/sdk/cmdline-tools" && mv "$HOME/sdk/cmdline-tools/cmdline-tools" "$HOME/sdk/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$HOME/sdk" >> "$GITHUB_ENV"
          echo "$HOME/sdk/cmdline-tools/latest/bin:$HOME/sdk/platform-tools:$HOME/sdk/emulator" >> "$GITHUB_PATH"
      - name: Emulator packages offered for this host
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list --channel=3 2>/dev/null | grep -iE '^\s*(emulator|system-images;android-3[0-9];google_apis;arm64)' | head -20 || true
      - name: Install emulator and an arm64 image
        run: |
          sdkmanager --channel=3 "emulator" "platform-tools" "system-images;android-34;google_apis;arm64-v8a" > /tmp/install.log 2>&1 || { tail -30 /tmp/install.log; exit 1; }
          ls "$ANDROID_SDK_ROOT/emulator" | head
          file "$ANDROID_SDK_ROOT/emulator/emulator" || true
      - name: Boot it
        run: |
          echo no | avdmanager create avd -n probe -k "system-images;android-34;google_apis;arm64-v8a" --force
          nohup emulator -avd probe -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel auto > /tmp/emu.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 5; done
          adb shell getprop sys.boot_completed
          adb shell getprop ro.product.cpu.abi
          adb shell getprop ro.build.version.sdk
          adb shell uname -a
      - name: Emulator log
        if: always()
        run: tail -60 /tmp/emu.log || true

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Host
        run: |
          uname -a
          sysctl -n machdep.cpu.brand_string
          echo "kern.hv_support=$(sysctl -n kern.hv_support 2>/dev/null || echo unknown)"
