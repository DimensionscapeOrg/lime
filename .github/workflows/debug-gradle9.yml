name: Debug Gradle 9
on: [push, workflow_dispatch]

env:
  HAXE_VERSION: 4.2.5
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
  HXCPP_NONINTERACTIVE: 1

jobs:

  android:
    runs-on: ubuntu-22.04
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c

      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Haxe dependencies
        uses: ./.github/actions/install-haxelib-libraries
        with:
          libraries: |
            native-desktop 1.2.1
            native-ipc 1.0.0
            StageWebView 1.1.0
            wsproto 1.0.0
            format 3.8.0
            hxp 1.3.1

      - name: Install Haxe dependencies from git
        shell: bash
        run: |
          haxelib git libhxcpp https://github.com/openfl/libhxcpp --quiet
          haxelib run libhxcpp setup
          haxe --cwd "$(haxelib libpath libhxcpp)/tools/hxcpp" compile.hxml

      - name: Prepare Lime
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime setup -alias -y -nocffi -eval

      - name: Configure Android support
        run: |
          lime config ANDROID_SDK $ANDROID_HOME -eval
          lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }} -eval
          lime config JAVA_HOME $JAVA_HOME -eval
          lime config ANDROID_SETUP true -eval

      - name: Rebuild Lime (Android)
        timeout-minutes: 90
        run: |
          lime rebuild android -release -nocolor -nocffi -eval

      - name: Install samples
        run: |
          haxelib git lime-samples https://github.com/openfl/lime-samples --quiet

      - name: Build HelloWorld with Gradle 9.4.1 and plugin 9.2.1
        run: |
          lime create HelloWorld -verbose -nocolor -eval
          cp HelloWorld/project.xml HelloWorld/project.default.xml
          sed -i 's#</project>#<config:android gradle-version="9.4.1" gradle-plugin="9.2.1" />
</project>#' HelloWorld/project.xml
          grep -n "gradle" HelloWorld/project.xml
          lime build HelloWorld android -debug -nocolor -eval
          grep -n "groovy-swing\|gradle:9" HelloWorld/Export/android/bin/build.gradle
          grep -n "archivesName" HelloWorld/Export/android/bin/app/build.gradle
          grep -rn "distributionUrl" HelloWorld/Export/android/bin/gradle/wrapper/gradle-wrapper.properties
          find HelloWorld/Export/android/bin/app/build/outputs -name "*.apk" -o -name "*.aab"
          test -f HelloWorld/Export/android/bin/app/build/outputs/apk/debug/HelloWorld-debug.apk

      - name: Build HelloWorld with the default Gradle and plugin
        run: |
          rm -rf HelloWorld/Export
          cp HelloWorld/project.default.xml HelloWorld/project.xml
          lime build HelloWorld android -debug -nocolor -eval
          find HelloWorld/Export/android/bin/app/build/outputs -name "*.apk" -o -name "*.aab"
