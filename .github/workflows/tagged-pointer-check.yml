name: Tagged pointer check

# Builds the app in .github/tagcheck for arm64 Android, with heap pointer tagging on,
# against Lime as it is (before) and with the DataPointer fix (after)

on:
  push:
    branches: [probe/android-arm64-tagging]
    paths: [.github/tagcheck/**, .github/workflows/tagged-pointer-check.yml]

jobs:
  apk:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: before
            ref: test/data-pointer-tagged-before-fix
          - variant: after
            ref: fix/data-pointer-tagged-pointers
    steps:
      - uses: actions/checkout@v6
        with:
          path: probe
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          path: lime
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5
      - name: Set HAXEPATH
        run: echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV
      - name: Install Haxe dependencies
        uses: ./lime/.github/actions/install-haxelib-libraries
        with:
          libraries: |
            native-desktop 1.2.2
            native-ipc 1.0.0
            StageWebView 1.1.1
            wsproto 1.1.2
            format 3.8.0
            hxp 1.3.1
            libhxcpp 6.0.0
      - name: Set up libhxcpp
        run: haxelib run libhxcpp setup
      - name: Prepare Lime
        working-directory: lime
        run: |
          haxelib dev lime $GITHUB_WORKSPACE/lime
          haxelib run lime setup -alias -y -nocffi -eval
          lime config ANDROID_SDK $ANDROID_HOME -eval
          lime config ANDROID_NDK_ROOT $ANDROID_NDK_ROOT -eval
          lime config JAVA_HOME $JAVA_HOME -eval
          lime config ANDROID_SETUP true -eval
      - name: Rebuild Lime (Android arm64)
        working-directory: lime
        timeout-minutes: 90
        run: lime rebuild android -arm64 -release -nocolor -nocffi -eval
      - name: Build the app
        working-directory: probe/.github/tagcheck
        run: |
          sed -i "s/VARIANT/${{ matrix.variant }}/g" project.xml
          lime build android -arm64 -debug -nocolor -eval
          grep -o 'allowNativeHeapPointerTagging="[a-z]*"' Export/android/bin/app/src/main/AndroidManifest.xml
          find Export/android/bin -name '*.apk'
      - uses: actions/upload-artifact@v7
        with:
          name: TagCheck-${{ matrix.variant }}
          path: probe/.github/tagcheck/Export/android/bin/**/*.apk
          if-no-files-found: error
