name: OpenFL tagged pointer check

# Builds OpenFL's Pirate Pig sample for arm64 Android with heap pointer tagging on,
# against Lime as it is (before) and with the DataPointer fix (after), and OpenFL develop

on:
  push:
    branches: [probe/android-arm64-tagging]
    paths: [.github/workflows/openfl-tagged-pointer-check.yml]

jobs:
  apk:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: before
            ref: test/data-pointer-tagged-before-fix
          - variant: after
            ref: fix/data-pointer-tagged-pointers
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          path: lime
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5
      - name: Set HAXEPATH
        run: echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV
      - name: Install Haxe dependencies
        uses: ./lime/.github/actions/install-haxelib-libraries
        with:
          libraries: |
            native-desktop 1.2.2
            native-ipc 1.0.0
            StageWebView 1.1.1
            wsproto 1.1.2
            format 3.8.0
            hxp 1.3.1
            libhxcpp 6.0.0
      - name: Set up libhxcpp
        run: haxelib run libhxcpp setup
      - name: Prepare Lime
        working-directory: lime
        run: |
          haxelib dev lime $GITHUB_WORKSPACE/lime
          haxelib run lime setup -alias -y -nocffi -eval
          lime config ANDROID_SDK $ANDROID_HOME -eval
          lime config ANDROID_NDK_ROOT $ANDROID_NDK_ROOT -eval
          lime config JAVA_HOME $JAVA_HOME -eval
          lime config ANDROID_SETUP true -eval
      - name: Rebuild Lime (Android arm64)
        working-directory: lime
        timeout-minutes: 90
        run: lime rebuild android -arm64 -release -nocolor -nocffi -eval
      - name: Install OpenFL develop, Actuate and the samples
        run: |
          haxelib --always git openfl https://github.com/openfl/openfl develop
          haxelib --always install actuate
          git clone --depth 1 --branch develop https://github.com/openfl/openfl-samples samples
          git -C "$(haxelib path openfl | head -1)/.." log -1 --format='OpenFL %h %s' || true
      - name: Build Pirate Pig
        working-directory: samples/demos/PiratePig
        run: |
          sed -i 's|package="org.openfl.samples.piratepig"|package="org.openfl.samples.piratepig.${{ matrix.variant }}"|; s|title="Pirate Pig"|title="Pirate Pig ${{ matrix.variant }}"|' project.xml
          sed -i 's|</project>|\t<config:android>\n\t\t<application android:allowNativeHeapPointerTagging="true" />\n\t</config:android>\n</project>|' project.xml
          cat project.xml
          lime build android -arm64 -debug -nocolor -eval
          grep -o 'allowNativeHeapPointerTagging="[a-z]*"' Export/android/bin/app/src/main/AndroidManifest.xml
          find Export/android/bin -name '*.apk'
      - uses: actions/upload-artifact@v7
        with:
          name: PiratePig-${{ matrix.variant }}
          path: samples/demos/PiratePig/Export/android/bin/**/*.apk
          if-no-files-found: error
